[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-intent"
version = "0.1.0"
description = "Resource-efficient emergent service-intent protocols for distributed AI-RAN agents (GENOME / Oulu research track)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Gunnar Cho" }, { name = "Edmund Gunn Jr." }]
keywords = ["multi-agent-reinforcement-learning", "AI-RAN", "service-intent", "Doc-POMDP"]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "gymnasium>=0.29",
  "pettingzoo>=1.24",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "hypothesis>=6.0",
  "coverage>=7.0",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
emergent-intent-smoke = "emergent_intent.cli:smoke_main"
emergent-intent-train = "emergent_intent.cli:train_main"
emergent-intent-eval = "emergent_intent.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: longer integration / medium experiments",
  "gpu: requires CUDA",
  "smoke: short deterministic smoke paths",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["emergent_intent"]
mypy_path = "src"

[tool.coverage.run]
source = ["emergent_intent"]
branch = true

[tool.coverage.report]
fail_under = 40
show_missing = true
